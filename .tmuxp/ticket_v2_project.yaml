session_name: ticket_v2_project
start_directory: ~/www/ticket_v2
windows:
- panes:
  # Claude・Codex の利用枠の計測を始める（~/bin/ai-warmup。先頭スペースで履歴に残さない）
  - shell_command:
    - ' ~/bin/ai-warmup &!'
  window_name: zsh
- panes:
  - ~/bin/claude-monitor --no-window --name vim -f ~/.tmuxp/ticket_v2_project/vim.txt -l left -w 55% -g 4x2
  window_name: vim
- panes:
  # 番号無しの枠（★ MAIN）は hub（~/www/ticket_v2_hub。12枠の取りまとめ役。説明は ~/.local/share/ticket-v2/hub/README.md）
  # 他の枠と同じく自動では起動せず、起動コマンドを履歴に積むだけ（↑ = continue、↑↑ = new。先頭スペースで積む操作自体は履歴に残さない）
  - shell_command:
    - ~/bin/claude-monitor --no-window --main-first --name monitor -f ~/.tmuxp/ticket_v2_project/monitor.txt -l left -w 65% -g 4x3
    - ' print -rs -- "bin/claude ticket_v2 ticket_v2_api --permission-mode auto"; print -rs -- "bin/claude ticket_v2 ticket_v2_api --permission-mode auto --continue"; clear'
  start_directory: ~/www/ticket_v2_hub
  window_name: monitor
- panes:
  - ~/bin/claude-monitor --no-window --name envs -f ~/.tmuxp/ticket_v2_project/envs.txt -l left -w 50% -g 2x2
  window_name: envs
- panes:
  - ~/bin/claude-monitor --no-window --name env1 -f ~/.tmuxp/ticket_v2_project/env1.txt -l left -w 65% -g 4x3
  window_name: env1
- panes:
  - ~/bin/claude-monitor --no-window --name env2 -f ~/.tmuxp/ticket_v2_project/env2.txt -l left -w 65% -g 4x3
  start_directory: ~/www/ticket_v2_second
  window_name: env2
- panes:
  - ~/bin/claude-monitor --no-window --name env3 -f ~/.tmuxp/ticket_v2_project/env3.txt -l left -w 65% -g 4x3
  start_directory: ~/www/ticket_v2_third
  window_name: env3
- panes:
  - ~/bin/claude-monitor --no-window --name env4 -f ~/.tmuxp/ticket_v2_project/env4.txt -l left -w 65% -g 4x3
  start_directory: ~/www/ticket_v2_fourth
  window_name: env4
