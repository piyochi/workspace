<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開発ダッシュボード</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
  --ok: #16a34a; --off: #9ca3af; --warn: #d97706; --bad: #dc2626; --accent: #2563eb; --bar: #e5e7eb;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #14161b; --card: #1d2027; --text: #e6e8ec; --muted: #9aa1ad; --line: #2c3039;
          --ok: #22c55e; --off: #6b7280; --warn: #f59e0b; --bad: #f87171; --accent: #60a5fa; --bar: #2c3039; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 14px/1.5 -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 12px 16px 24px; }
/* ヘッダーは上に固定（スクロールしてもついてくる）。モーダル（z-index 10）より下 */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: -12px -16px 8px; padding: 8px 16px 6px;
         border-bottom: 1px solid var(--line); }
.head-row { display: flex; justify-content: space-between; align-items: baseline; }
.sys { display: flex; gap: 14px; margin-top: 4px; font-size: 12px; }
.gauge { flex: 1; min-width: 0; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px; }
.gauge-label { color: var(--muted); }
.gauge .bar { height: 6px; }
.gauge .bar > i { transition: width .4s; }
.gauge-val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
h1 { font-size: 15px; margin: 0; }
.updated { color: var(--muted); font-size: 12px; }
.sec { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
.sec > summary { list-style: none; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px; }
.sec > summary::-webkit-details-marker { display: none; }
.sec > summary::before { content: "▸"; color: var(--muted); font-size: 11px; transition: transform .15s; }
.sec[open] > summary::before { transform: rotate(90deg); }
.sec[open] > summary { margin-bottom: 6px; }
h2 { font-size: 12px; color: var(--muted); margin: 0; font-weight: 600; letter-spacing: .04em; }
.ticket { font-weight: 700; color: var(--accent); }
.env { display: flex; align-items: center; gap: 10px; padding: 6px 0; flex-wrap: wrap; }
.env + .env { border-top: 1px solid var(--line); }
.env-name { font-weight: 700; width: 40px; }
.chips { display: flex; gap: 10px; flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); }
.dot.on { background: var(--ok); }
.dot.detached { background: #eab308; }
.actions { display: flex; gap: 6px; }
select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.acct { padding: 6px 0; }
.acct + .acct { border-top: 1px solid var(--line); }
.acct-head { display: flex; justify-content: space-between; gap: 8px; }
.acct-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.win { display: grid; grid-template-columns: 28px 1fr 72px; align-items: center; gap: 8px; margin-top: 4px; }
.win-label { color: var(--muted); font-size: 12px; }
.bar { height: 8px; background: var(--bar); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.bar > i.warn { background: var(--warn); } .bar > i.bad { background: var(--bad); }
.pct { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.reset { grid-column: 2 / 4; color: var(--muted); font-size: 11px; margin-top: -2px; }
.stale { color: var(--warn); }
.empty, .msg { color: var(--muted); font-size: 12px; }
pre { margin: 6px 0 0; padding: 8px; background: var(--bg); border-radius: 6px; font-size: 11px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.err { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cell { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-height: 52px; background: var(--bg); cursor: pointer; }
.cell:hover { outline: 2px solid var(--accent); outline-offset: -1px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 12px; z-index: 10; }
.modal.open { display: flex; }
.modal-box { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; width: min(960px, 100%); height: min(85vh, 900px); display: flex; flex-direction: column; }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.back { color: var(--accent); text-decoration: none; font-size: 13px; white-space: nowrap; }
.back:hover { text-decoration: underline; }
.modal-title { flex: 1; font-weight: 700; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal-meta { color: var(--muted); font-size: 11px; white-space: nowrap; }
.modal-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.modal-actions .label { color: var(--muted); }
.modal-actions .st { font-weight: 700; }
.modal-actions button.danger { border-color: var(--bad); color: var(--bad); }
.modal-body { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; white-space: pre-wrap; word-break: break-all; background: var(--bg); border-radius: 0 0 10px 10px; max-height: none; }
/* 枠名と連動先を必ず1行に。枠名が長ければ枠名の方を … で切り、連動先は常に見せる */
.cell-head { font-size: 11px; color: var(--muted); display: flex; align-items: baseline; gap: 4px; white-space: nowrap; min-width: 0; }
.cell-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cell-head .cell-link { flex-shrink: 0; }
.cell-state { font-weight: 700; font-size: 12px; }
.cell-task { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-skill.done, .skill-done { color: var(--muted); }
.cell-skill { font-size: 11px; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell-link { color: var(--accent); font-weight: 700; }
.cell-link.env { font-weight: 400; }
.modal-link { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
.modal-link .label { color: var(--muted); }
.link-filter { display: flex; gap: 6px; margin-bottom: 6px; }
.link-filter input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; }
.link-row { padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
.link-row:first-child { border-top: 0; }
.link-ticket { font-weight: 700; }
.link-meta { display: flex; gap: 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.link-cat { color: var(--accent); }
.link-url { color: var(--accent); word-break: break-all; }
.link-ctx { color: var(--muted); font-size: 12px; word-break: break-all; }
.link-more { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
.link-more .label { color: var(--muted); font-size: 11px; }
.links-modal-filter { padding: 8px 12px; margin: 0; border-bottom: 1px solid var(--line); }
.links-modal-body { flex: 1; overflow: auto; padding: 4px 12px 12px; }
.rm-row { padding: 5px 0; border-top: 1px solid var(--line); font-size: 12px; }
.rm-row:first-child { border-top: 0; }
.rm-head { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.rm-head a { color: var(--accent); font-weight: 700; text-decoration: none; white-space: nowrap; }
.rm-tag { font-size: 10px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; color: var(--muted); }
.rm-tag.hot { border-color: var(--bad); color: var(--bad); }
.rm-copy { flex: none; font-size: 11px; padding: 0 5px; line-height: 16px; }
.rm-subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rm-info { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; font-size: 11px; color: var(--muted); }
/* 今日（朝 4:00 以降）の作業。「今日作業した」で絞り込んだときは入力した文・コミットも出す */
.rm-today { color: var(--accent); font-weight: 600; }
.rm-tag.extra { border-color: var(--warn); color: var(--warn); }
.rm-log { margin: 3px 0 0 8px; padding-left: 8px; border-left: 2px solid var(--line); font-size: 11px; color: var(--muted); }
.rm-log div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rm-log b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.rm-sess { color: var(--text); }
.rm-sess.busy { color: #ea580c; font-weight: 700; } .rm-sess.wait { color: var(--bad); font-weight: 700; } .rm-sess.idle { color: var(--ok); }
.rm-br { flex-basis: 100%; display: flex; align-items: flex-start; gap: 6px; }
.rm-br-text { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.rm-br.open .rm-br-text { display: block; }
.rm-br-tg { flex: none; font-size: 10px; padding: 0 6px; line-height: 16px; }
.bp { font-size: 10px; margin-left: 1px; }
.bp.warn { color: #d97706; font-weight: 700; }
.bp.ok { color: #16a34a; }
.bpr { font-size: 10px; text-decoration: none; border-radius: 3px; padding: 0 3px; border: 1px solid currentColor; }
.bpr.open { color: #16a34a; } .bpr.draft { color: var(--muted); } .bpr.merged { color: #8b5cf6; } .bpr.closed { color: #dc2626; text-decoration: line-through; }
.rm-bk { text-decoration: underline dotted; cursor: help; }
.rm-cur { color: var(--text); font-weight: 700; }
.rm-full { margin-left: auto; flex-shrink: 0; font-size: 11px; padding: 1px 6px; }
.rm-wait { color: var(--bad); font-weight: 700; }
.rm-wait.done { color: var(--muted); font-weight: 400; text-decoration: line-through; }
.rm-rel a, .rm-wait a { color: inherit; }
.modal-link label { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; cursor: pointer; }
.cell.busy { border-color: #f97316; } .cell.busy .cell-state { color: #ea580c; }
.cell.wait { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--bg)); } .cell.wait .cell-state { color: var(--bad); }
.cell.idle .cell-state { color: var(--ok); }
.cell.stopped { opacity: .55; } .cell.stopped .cell-state { color: var(--off); }
</style>
</head>
<body>
<main>
  <header>
    <div class="head-row"><h1>開発ダッシュボード</h1><span class="updated" id="updated">読み込み中…</span></div>
    <div class="sys">
      <div class="gauge" id="g-cpu"><span class="gauge-label">CPU</span><div class="bar"><i style="width:0"></i></div><span class="gauge-val">–</span></div>
      <div class="gauge" id="g-mem"><span class="gauge-label">メモリ</span><div class="bar"><i style="width:0"></i></div><span class="gauge-val">–</span></div>
    </div>
  </header>

  <details class="sec" data-key="claude" open>
    <summary><h2>Claude</h2></summary>
    <div id="claude"></div>
  </details>

  <details class="sec" data-key="codex" open>
    <summary><h2>Codex</h2></summary>
    <div id="codex"></div>
  </details>

  <details class="sec" data-key="tmux" open>
    <summary><h2>tmux [1]〜[12]</h2></summary>
    <div id="panes"></div>
  </details>

  <details class="sec" data-key="servers" open>
    <summary><h2>開発サーバー</h2></summary>
    <div id="servers"></div>
    <div id="job"></div>
  </details>

  <details class="sec" data-key="redmine" open>
    <summary><h2>Redmine 担当チケット</h2></summary>
    <div id="redmine"></div>
    <div class="link-more"><button id="redmine-more">もっと見る</button><button id="redmine-reload">取り直す</button> <span class="label" id="redmine-meta"></span></div>
  </details>

  <details class="sec" data-key="links" open>
    <summary><h2>リンク</h2></summary>
    <div id="links"></div>
    <div class="link-more"><button id="link-more">もっと見る</button><button id="link-reload">取り直す</button> <span class="label" id="link-count"></span></div>
  </details>
</main>

<div class="modal" id="rm-modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <a href="#" class="back" id="rm-back">← 戻る</a>
      <span class="modal-title">Redmine 担当チケット</span>
      <span class="modal-meta" id="rm-modal-meta"></span>
    </div>
    <div class="link-filter links-modal-filter">
      <select id="rm-cat"><option value="">すべて</option></select>
      <input id="rm-q" type="search" placeholder="番号・件名・ブランチ・枠名で検索（スペース区切りで全部を含むもの）">
    </div>
    <div class="links-modal-body" id="rm-all"></div>
  </div>
</div>

<div class="modal" id="links-modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <a href="#" class="back" id="links-back">← 戻る</a>
      <span class="modal-title">リンク一覧</span>
      <span class="modal-meta" id="links-meta"></span>
    </div>
    <div class="link-filter links-modal-filter">
      <select id="link-cat"><option value="">すべて</option></select>
      <input id="link-q" type="search" placeholder="URL・前後の文・枠名で検索（スペース区切りで全部を含むもの）">
    </div>
    <div class="links-modal-body" id="links-all"></div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">
      <a href="#" class="back" id="modal-back">← 戻る</a>
      <span class="modal-title" id="modal-title"></span>
      <span class="modal-meta" id="modal-meta"></span>
      <button id="modal-copy">全部コピー</button>
    </div>
    <div class="modal-actions" id="modal-actions"></div>
    <div class="modal-link" id="modal-link"></div>
    <pre class="modal-body" id="modal-body"></pre>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = (t) => new Date(t * 1000).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
const fmtReset = (t) => {
  if (!t) return "";
  const d = new Date(t * 1000), now = new Date();
  const same = d.toDateString() === now.toDateString();
  const s = same ? fmtTime(t) : `${d.getMonth() + 1}/${d.getDate()}(${"日月火水木金土"[d.getDay()]}) ${fmtTime(t)}`;
  const mins = Math.max(0, Math.round((t * 1000 - now) / 60000));
  const left = mins >= 1440 ? `${Math.floor(mins / 1440)}日${Math.floor(mins % 1440 / 60)}時間` : `${Math.floor(mins / 60)}時間${mins % 60}分`;
  return `${s} リセット（あと${left}）`;
};
let jobPolling = null;

function renderServers(s) {
  if (s.error) { $("servers").innerHTML = `<div class="err">${esc(s.error)}</div>`; return; }
  const busy = !!(window.__job && window.__job.running);
  $("servers").innerHTML = Object.entries(s.envs).map(([env, comps]) => `
    <div class="env">
      <span class="env-name">${env}</span>
      <span class="chips">${["api", "app", "sqs"].map((c) =>
        comps[c] === "detached"
          ? `<span class="chip" title="動いていますが、枠の docker compose up が終わっています（ログが出ず、停止も効きません）。起動を押すと枠につなぎ直します"><span class="dot detached"></span>${c}（枠外）</span>`
          : `<span class="chip"><span class="dot ${comps[c] ? "on" : ""}"></span>${c}</span>`).join("")}</span>
      <span class="actions">
        <select id="sel-${env}"><option value="all">全部</option><option value="api">api</option><option value="app">app</option><option value="sqs">sqs</option></select>
        <button data-env="${env}" data-action="up" ${busy ? "disabled" : ""}>起動</button>
        <button data-env="${env}" data-action="down" ${busy ? "disabled" : ""}>停止</button>
        <button class="primary" data-env="${env}" data-action="restart" ${busy ? "disabled" : ""}>再起動</button>
      </span>
    </div>`).join("") + (s.messages.length ? `<div class="msg">${s.messages.map(esc).join("<br>")}</div>` : "");
  document.querySelectorAll("button[data-env]").forEach((b) => b.onclick = () => run(b.dataset.action, b.dataset.env));
}

function renderUsage(el, rows, staleMin, now) {
  if (!rows.length) { el.innerHTML = `<div class="empty">まだデータがありません（使うと出ます）</div>`; return; }
  el.innerHTML = rows.map((r) => {
    const stale = r.updated_at && (now - r.updated_at) > staleMin * 60;
    const wins = Object.entries(r.windows).filter(([, w]) => w);
    return `<div class="acct">
      <div class="acct-head"><span class="acct-name">${esc(r.label)}${r.plan ? ` <span class="acct-meta">${esc(r.plan)}</span>` : ""}</span>
        <span class="acct-meta ${stale ? "stale" : ""}">${r.updated_at ? fmtTime(r.updated_at) + " 時点" + (stale ? "（古い）" : "") : "未取得"}</span></div>
      ${wins.length ? wins.map(([name, w]) => {
        const p = Math.min(100, w.percent), cls = p >= 90 ? "bad" : p >= 70 ? "warn" : "";
        return `<div class="win"><span class="win-label">${esc(name)}</span><span class="bar"><i class="${cls}" style="width:${p}%"></i></span><span class="pct">${p.toFixed(0)}%</span>
          <span></span><span class="reset">残り ${(100 - p).toFixed(0)}%${w.resets_at ? `・${fmtReset(w.resets_at)}` : ""}</span></div>`;
      }).join("") : `<div class="empty">使用率の記録がありません</div>`}
    </div>`;
  }).join("");
}

async function refresh() {
  try {
    const d = await (await fetch("/api/status")).json();
    renderServers(d.servers);
    renderUsage($("claude"), d.claude, d.stale_minutes, d.now);
    renderUsage($("codex"), d.codex, d.stale_minutes * 48, d.now);
    $("updated").textContent = `更新 ${fmtTime(d.now)}`;
  } catch (e) {
    $("updated").innerHTML = `<span class="err">Mac に接続できません</span>`;
  }
}

function renderJob(j) {
  window.__job = j;
  if (!j.target) { $("job").innerHTML = ""; return; }
  const state = j.running ? "実行中…" : j.rc === 0 ? "✅ 完了" : "⚠️ 失敗あり";
  $("job").innerHTML = `<pre><b>${esc(j.target)}: ${state}</b>\n${esc(j.output)}</pre>`;
  const pre = $("job").querySelector("pre"); pre.scrollTop = pre.scrollHeight;
}

async function pollJob() {
  const j = await (await fetch("/api/job")).json();
  renderJob(j);
  if (!j.running) { clearInterval(jobPolling); jobPolling = null; refresh(); }
}

const ACTION_NAMES = { up: "起動", down: "停止", restart: "再起動" };
async function run(action, env) {
  const comp = $(`sel-${env}`).value;
  const what = comp === "all" ? "api / app / sqs 全部" : comp;
  if (!confirm(`${env} の ${what} を${ACTION_NAMES[action]}します。よろしいですか？`)) return;
  const res = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json", "X-Dashboard": "1" }, body: JSON.stringify({ action, env, comp }) });
  const d = await res.json();
  if (!res.ok) { alert(d.error || "失敗しました"); return; }
  document.querySelectorAll("button[data-env]").forEach((b) => b.disabled = true);
  if (!jobPolling) jobPolling = setInterval(pollJob, 1500);
  pollJob();
}

// チケット番号（タイトル優先、無ければそのセッションのやり取り）を先頭に出し、作業名を後ろに続ける。
// タイトルに番号があればタイトルからは番号を抜いて重複させない
function taskHtml(s) {
  let task = s.task || "";
  if (s.ticket_from === "title") {
    task = task.replace(new RegExp(`#?${s.ticket}`), "").replace(/^[\s:：\-|]+|[\s:：\-|]+$/g, "").replace(/\s{2,}/g, " ");
  }
  if (!s.ticket) return task ? esc(task) : "&nbsp;";
  const from = s.ticket_from === "session" ? ' title="セッションのやり取りから"' : "";
  return `<span class="ticket"${from}>#${s.ticket}</span> ${esc(task)}`;
}

let prevStates = null;
// スキル: 使っている最中は ⚙、最後の返答が質問でなく区切りがついたら灰色の ✓（次のスキルまで残す）
const skillText = (s) => s.skill_done ? `✓ ${esc(s.skill)}` : `⚙ ${esc(s.skill)}`;
const skillTip = (s) => s.skill_done ? `スキル: ${s.skill}（終わったとみなしています）` : `スキル: ${s.skill}（使用中）`;
const PANE_STATES = { busy: "処理中", wait: "確認待ち", idle: "入力待ち", stopped: "停止" };
async function refreshPanes() {
  try {
    const d = await (await fetch("/api/panes")).json();
    if (!d.running) { $("panes").innerHTML = `<div class="empty">現在 ticket_v2_project は動いていません（tmuxp が起動していません）</div>`; return; }
    const bySlot = Object.fromEntries(d.slots.map((s) => [s.slot, s]));
    // どれかの枠が「処理中」から抜けたら（返答が終わった）、リンクをその場で集め直す
    if (prevStates && d.slots.some((s) => prevStates[s.slot] === "busy" && s.state !== "busy")) loadLinks(true);
    prevStates = Object.fromEntries(d.slots.map((s) => [s.slot, s.state]));
    window.__slots = bySlot;
    if (modalSlot) renderLink();
    $("panes").innerHTML = `<div class="grid">${Array.from({ length: 12 }, (_, i) => {
      const s = bySlot[i + 1];
      if (!s) return `<div class="cell stopped"><div class="cell-head">[${i + 1}]</div><div class="cell-state">なし</div></div>`;
      return `<div class="cell ${s.state}" data-slot="${s.slot}" title="${esc(cellTip(s))}">
        <div class="cell-head"><span class="cell-name">[${s.slot}] ${esc(s.env)} ${esc(s.kind)}</span>${linkHtml(s)}</div>
        <div class="cell-state">${PANE_STATES[s.state] || esc(s.state)}${s.subagents ? `（サブ${s.subagents}）` : ""}</div>
        <div class="cell-task">${taskHtml(s)}</div>
        <div class="cell-skill${s.skill_done ? " done" : ""}">${s.skill ? skillText(s) : "&nbsp;"}</div></div>`;
    }).join("")}</div>`;
  } catch (e) { /* 接続エラーは refresh() 側で表示する */ }
}

// 開閉の状態はこのブラウザにだけ覚える（読めなくても全部開いた状態で動く）
document.querySelectorAll("details.sec").forEach((d) => {
  try { if (localStorage.getItem(`dd-sec-${d.dataset.key}`) === "closed") d.open = false; } catch (e) {}
  d.addEventListener("toggle", () => { try { localStorage.setItem(`dd-sec-${d.dataset.key}`, d.open ? "open" : "closed"); } catch (e) {} });
});

// 枠の画面を見る（見るだけ。開いている間は 3 秒ごとに更新。下までスクロールしているときだけ最新に追従）
let modalSlot = null, modalTimer = null;
async function loadPane() {
  if (!modalSlot) return;
  const body = $("modal-body");
  // 文字を選んでいる間は書き換えない（書き換えると選択が外れてコピーできない）
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed && body.contains(sel.anchorNode)) {
    $("modal-meta").textContent = "選択中は更新を止めています";
    return;
  }
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
  try {
    const d = await (await fetch(`/api/pane?slot=${modalSlot}`)).json();
    if (d.error) { body.textContent = d.error; return; }
    $("modal-title").textContent = d.title;
    renderActions(d);
    if (body.textContent !== d.text) body.textContent = d.text;
    $("modal-meta").textContent = `更新 ${new Date().toLocaleTimeString("ja-JP")}`;
    if (atBottom) body.scrollTop = body.scrollHeight;
  } catch (e) { $("modal-meta").textContent = "取得できませんでした"; }
}
function openPane(slot) {
  // ブラウザの「戻る」でも閉じられるよう、開いたときに履歴を1つ積む
  if (!modalSlot) { try { history.pushState({ pane: slot }, ""); } catch (e) {} }
  modalSlot = slot; actionsKey = ""; linkKey = "";
  $("modal-actions").innerHTML = "";
  renderLink();
  $("modal-title").textContent = `[${slot}]`;
  $("modal-body").textContent = "読み込み中…";
  $("modal").classList.add("open");
  $("modal-body").scrollTop = 0;
  loadPane().then(() => { $("modal-body").scrollTop = $("modal-body").scrollHeight; });
  clearInterval(modalTimer); modalTimer = setInterval(loadPane, 3000);
}
function hidePane() { modalSlot = null; clearInterval(modalTimer); $("modal").classList.remove("open"); }
// 戻るリンク・Esc・外側クリックは、積んだ履歴を戻して閉じる（ブラウザの戻ると同じ動き）
function closePane() { if (!modalSlot) return; if (history.state && history.state.pane) history.back(); else hidePane(); }
window.addEventListener("popstate", hidePane);
$("panes").addEventListener("click", (e) => { const c = e.target.closest(".cell[data-slot]"); if (c) openPane(Number(c.dataset.slot)); });
// 全部コピー。http（LAN の IP）では navigator.clipboard が使えないことがあるので、textarea 経由の方法も用意する
// マウスを乗せたときの説明: 1行目に「[9] env3 claude -> [3][10]」、2行目以降に作業名・スキル
function cellTip(s) {
  const head = `[${s.slot}] ${s.env} ${s.kind}${s.link ? ` -> ${s.link.slots.map((n) => `[${n}]`).join("")}` : ""}`;
  return [head, s.task, s.skill ? skillTip(s) : ""].filter(Boolean).join("\n");
}

// 連動先の表示。ダッシュボードで付けたものは太字、起動時の CODEX_SLOT のものは細字
function linkHtml(s) {
  if (!s.link) return "";
  const env = s.link.from === "codex_slot";
  return `<span class="cell-link${env ? " env" : ""}" title="${env ? "起動時の CODEX_SLOT" : "ダッシュボードで設定"}">→${s.link.slots.map((n) => `[${n}]`).join("")}</span>`;
}

// 連動先を選ぶ欄。印はペインに付き、ct-link スキルが CODEX_SLOT より先に見る
let linkKey = "";
function renderLink() {
  const s = (window.__slots || {})[modalSlot];
  if (!s) { $("modal-link").innerHTML = ""; linkKey = ""; return; }
  const cur = s.link ? s.link.slots : [];
  const key = `${modalSlot}|${cur.join(",")}|${s.link ? s.link.from : ""}|${s.skill}|${s.skill_done}`;
  if (key === linkKey) return;  // 変わったときだけ描き直す（選びかけの選択が戻らないように）
  linkKey = key;
  const from = !s.link ? "なし" : s.link.from === "dashboard" ? "ダッシュボードで設定" : "起動時の CODEX_SLOT";
  // 連動先は複数選べる。起動時の CODEX_SLOT の連動先は、最初からチェックした状態で出す
  const boxes = Array.from({ length: 12 }, (_, i) => i + 1).filter((n) => n !== modalSlot).map((n) => {
    const t = window.__slots[n];
    return `<label title="${t ? `${esc(t.env)} ${esc(t.kind)}` : ""}"><input type="checkbox" class="link-cb" value="${n}" ${cur.includes(n) ? "checked" : ""}>[${n}]</label>`;
  }).join("");
  $("modal-link").innerHTML = `<span class="label">連動先:</span>${boxes}
    <button id="link-set">設定</button><button id="link-clear">外す</button><span class="label">（今: ${cur.length ? `${cur.map((n) => `[${n}]`).join("")}・` : ""}${from}）</span>
    ${s.skill ? `<span class="label">スキル:</span><span class="${s.skill_done ? "skill-done" : ""}" title="${esc(skillTip(s))}">${skillText(s)}</span>` : ""}`;
  const save = async (targets) => {
    try {
      const res = await fetch("/api/link", { method: "POST", headers: { "Content-Type": "application/json", "X-Dashboard": "1" }, body: JSON.stringify({ slot: modalSlot, targets }) });
      const d = await res.json();
      $("modal-meta").textContent = d.error || d.message || "";
    } catch (e) { $("modal-meta").textContent = "送れませんでした"; }
    linkKey = ""; await refreshPanes();
  };
  $("link-set").onclick = () => save([...document.querySelectorAll(".link-cb:checked")].map((c) => Number(c.value)));
  $("link-clear").onclick = () => save([]);
}

// 起動・停止ボタン。起動は止まっている枠だけ、停止は入力待ちの枠だけ押せる
let actionsKey = "";
function renderActions(d) {
  const key = `${d.slot}|${d.state}|${pendingCli}`;
  if (key === actionsKey) return;  // 状態が変わったときだけ描き直す（押そうとしたボタンが消えないように）
  actionsKey = key;
  const stopped = d.state === "stopped", busy = !!pendingCli;
  const launch = d.modes.map((m) => `<button data-kind="${m.kind}" data-mode="${m.mode}" title="${esc(m.cmd)}" ${!stopped || busy ? "disabled" : ""}>${esc(m.label)}</button>`).join("");
  const stopTip = d.state === "idle" ? "" : stopped ? "動いていません" : "処理中・確認待ちの間は止めません";
  const now = d.state === "stopped" ? "" : `${d.kind === "claude" ? "Claude" : "Codex"} `;
  $("modal-actions").innerHTML = `<span class="st">${now}${PANE_STATES[d.state] || esc(d.state)}</span>
    <span class="label">起動:</span>${launch}<button class="danger" data-stop="1" title="${stopTip}" ${d.state !== "idle" || busy ? "disabled" : ""}>停止</button>
    ${busy ? `<span class="label">${esc(pendingCli)}…</span>` : ""}`;
  $("modal-actions").querySelectorAll("button[data-mode]").forEach((b) => b.onclick = () => cli("launch", b.dataset.kind, b.dataset.mode, b.title));
  const sb = $("modal-actions").querySelector("button[data-stop]"); if (sb) sb.onclick = () => cli("stop");
}
let pendingCli = "";
async function cli(action, kind, mode, cmd) {
  const what = action === "stop" ? "停止" : `起動（${cmd}）`;
  if (!confirm(`[${modalSlot}] を${what}します。よろしいですか？`)) return;
  pendingCli = action === "stop" ? "停止中" : "起動中"; actionsKey = "";
  await loadPane();
  try {
    const res = await fetch("/api/cli", { method: "POST", headers: { "Content-Type": "application/json", "X-Dashboard": "1" }, body: JSON.stringify({ action, kind, mode, slot: modalSlot }) });
    const d = await res.json();
    $("modal-meta").textContent = d.error || d.message || "";
  } catch (e) { $("modal-meta").textContent = "送れませんでした"; }
  pendingCli = ""; actionsKey = "";
  await loadPane(); refreshPanes();
}

async function copyText(text) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch (e) {}
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
  }
  return ok;
}
$("modal-copy").onclick = async () => {
  const ok = await copyText($("modal-body").textContent);
  $("modal-meta").textContent = ok ? "コピーしました" : "コピーできませんでした（文字を選んで Ctrl+C）";
};

// 外側クリックで閉じるのは、押した所も離した所も外側のときだけ。

// URL が書かれていた行を出し、その中の URL 部分をリンクにする（行が無ければ URL だけ）
function linkedContext(v) {
  const a = `<a class="link-url" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${esc(v.url)}</a>`;
  const ctx = v.context || "";
  const i = ctx.indexOf(v.url);
  if (i < 0) return a;
  return `${esc(ctx.slice(0, i))}${a}${esc(ctx.slice(i + v.url.length))}`;
}

// リンク一覧: AI が出した文章の URL（新しい順）。トップは最新 10 件だけ。
// 「もっと見る」で詳細画面を開き、種類のセレクト・フリーワードで絞り込んで全部をスクロールで見る
function linkRows(items, days) {
  return items.length ? items.map((v) => {
    const t = new Date(v.ts * 1000);
    const when = `${t.getMonth() + 1}/${t.getDate()} ${t.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}`;
    return `<div class="link-row">
      <div class="link-meta"><span>${when}</span><span>${esc(v.src)}</span><span class="link-cat">${esc(v.cat)}</span></div>
      <div class="link-ctx" title="${esc(v.context || v.url)}">${v.ticket ? `${v.ticket_url ? `<a class="link-ticket" href="${esc(v.ticket_url)}" target="_blank" rel="noopener noreferrer">#${esc(v.ticket)}</a>` : `<span class="link-ticket">#${esc(v.ticket)}</span>`}: ` : ""}${linkedContext(v)}</div>
    </div>`;
  }).join("") : `<div class="empty">該当するリンクはありません（直近${days}日）</div>`;
}
async function fetchLinks(params) {

}

    $("link-more").style.display = d.total > 10 ? "" : "none";

}
let linksOpen = false, linkTimer = null;

$("link-more").onclick = openLinks;
$("link-reload").onclick = async (e) => { const b = e.target; b.disabled = true; await loadLinks(true); b.disabled = false; };
$("links-back").onclick = (e) => { e.preventDefault(); closeLinks(); };

$("links-modal").addEventListener("click", (e) => { if (e.target.id === "links-modal" && downOnLinksOverlay) closeLinks(); downOnLinksOverlay = false; });

// Redmine 担当チケット: どの枠（セッション）で扱っているか・どの環境にブランチ / issue docs があるか・待ちの関係を添える。
// トップは 10 件だけ。「もっと見る」で詳細画面を開き、セレクトとフリーワードで絞り込んで全部をスクロールで見る
let rmData = null, rmOpen = false, rmTimer = null;
function rmRelHtml(i) {
  const base = i.url.replace(/\/issues\/\d+$/, "");
  return i.relations.map((r) => {
    const a = `<a href="${esc(base)}/issues/${r.id}" target="_blank" rel="noopener noreferrer" title="${esc(r.subject || "")}">#${r.id}</a>`;
    const st = r.status ? `（${esc(r.status)}）` : "";
    if (r.kind === "wait") {
      // コメント・本文から拾ったものは「リリース後」などの書き方をそのまま出し、元の文はマウスを乗せると出す
      const what = r.phrase ? esc(r.phrase.replace(/\s+/g, "")) : "待ち";
      const tip = `${r.closed ? "待ち相手は終わっています。" : ""}${esc(r.via)}${r.note ? `: ${esc(r.note)}` : "で待ち"}`;
      return `<span class="rm-wait ${r.closed ? "done" : ""}" title="${tip}">⏳ ${a} ${what}${st}</span>`;
    }
    if (r.kind === "blocking") return `<span class="rm-rel">${a} が待っている${st}</span>`;
    return `<span class="rm-rel">関連 ${a}${st}</span>`;
  });
}
const rmFull = {};  // チケット番号 -> 全期間の検索結果
function mdDate(t) { const d = new Date(t * 1000); return `${d.getMonth() + 1}/${d.getDate()}`; }
function ymdDate(t) { const d = new Date(t * 1000); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; }
function fullHtml(r) {
  if (r.error) return `<span class="err">${esc(r.error)}</span>`;
  const parts = r.sessions.map((x) => `${esc(x.where)} ${ymdDate(x.last)}`)
    .concat(r.commits.map((c) => `git ${esc(c.where)} ${c.count}件・${ymdDate(c.last)}`));
  return `<span>全期間: ${parts.length ? parts.join("・") : "見つかりませんでした"}</span>`;
}

// push の状態（最後に fetch した時点の origin と比べる）
function pushHtml(p) {
  if (!p) return "";
  if (!p.remote) return ` <span class="bp warn" title="origin にこのブランチがありません">未push</span>`;
  const parts = [];
  if (p.ahead && p.behind) return ` <span class="bp warn" title="手元と origin が食い違っています（rebase・force push の前の古い手元など）。手元にだけ ${p.ahead} 件・origin にだけ ${p.behind} 件">食い違い</span>`;
  if (p.ahead) parts.push(`<span class="bp warn" title="push していないコミットが ${p.ahead} 件">↑${p.ahead}</span>`);
  if (p.behind) parts.push(`<span class="bp" title="origin に手元に無いコミットが ${p.behind} 件（pull していない）">↓${p.behind}</span>`);
  if (!parts.length && p.ahead === 0) parts.push(`<span class="bp ok" title="push 済み（origin と同じ）">✓</span>`);
  return " " + parts.join("");
}
const PR_STATE = { open: "レビュー中", merged: "マージ済み", closed: "閉じた" };
function prHtml(pr) {
  if (!pr) return "";
  const st = pr.draft && pr.state === "open" ? "draft" : pr.state;
  return ` <a class="bpr ${st}" href="${esc(pr.url)}" target="_blank" rel="noopener noreferrer" title="PR #${pr.number}（${st === "draft" ? "下書き" : PR_STATE[pr.state] || esc(pr.state)}）">PR#${pr.number}</a>`;
}
const rmBrOpen = new Set();
// ブランチの行が1行に収まらないものだけ ▸ を出す（閉じた欄・隠れた画面では測れないので、開いたときに測り直す）

}
document.addEventListener("click", (e) => {

document.querySelector('details.sec[data-key="redmine"]')?.addEventListener("toggle", () => fitBr($("redmine")));
const hm = (t) => new Date(t * 1000).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
const todayOf = (i) => rmData && rmData.today && rmData.today.tickets[String(i.id)];
// 今日の作業の1行: 「今日: env2 10:05〜13:27・コミット4」
function todayHtml(t) {
  const span = t.envs.map((e) => `${esc(e.env)} ${hm(e.first)}${hm(e.first) === hm(e.last) ? "" : `〜${hm(e.last)}`}`);
  if (t.commits.length) span.push(`コミット${t.commits.length}`);
  return `<span class="rm-today" title="朝 4:00 以降にこのチケットで作業したセッションの時間帯と、refs #番号 の自分のコミット">今日: ${span.join("・")}</span>`;
}
// 「今日作業した」で絞り込んだときだけ: 入力した文（新しい順）とコミット
function todayLogHtml(t) {
  const rows = [...t.prompts.map((p) => ({ ts: p.ts, html: `<b>${hm(p.ts)}</b> ${esc(p.env)} ${esc(p.text)}`, title: p.text })),
    ...t.commits.map((c) => ({ ts: c.ts, html: `<b>${hm(c.ts)}</b> コミット ${esc(c.where)}: ${esc(c.subject)}`, title: c.subject }))]
    .sort((a, b) => b.ts - a.ts);
  return rows.length ? `<div class="rm-log">${rows.map((r) => `<div title="${esc(r.title)}">${r.html}</div>`).join("")}</div>` : "";
}
function rmRows(items, opts = {}) {
  return items.length ? items.map((i) => {
    const td = todayOf(i);
    const sess = i.sessions.map((x) => `<span class="rm-sess ${x.state}">▶ [${x.slot}] ${esc(x.env)} ${esc(x.kind)} ${PANE_STATES[x.state] || ""}${x.skill ? ` <span class="${x.skill_done ? "skill-done" : ""}">${skillText(x)}</span>` : ""}</span>`);
    // ブランチは環境ごとにまとめる。checkout 中のものは太字
    const byEnv = {};
    // 退避用の backup/ は数だけ出す（checkout 中なら名前も出す）
    const backups = {};
    i.branches.forEach((b) => {
      if (b.branch.startsWith("backup/") && !b.current) {
        (backups[b.env] = backups[b.env] || []).push(`${b.branch}${b.repo === "ticket_v2" ? "(front)" : "(api)"}`);
        byEnv[b.env] = byEnv[b.env] || [];
        return;
      }
      (byEnv[b.env] = byEnv[b.env] || []).push(`${b.current ? `<span class="rm-cur" title="checkout 中">${esc(b.branch)}</span>` : esc(b.branch)}${b.repo === "ticket_v2" ? "(front)" : "(api)"}${pushHtml(b.push)}${prHtml(b.pr)}`);
    });
    Object.entries(backups).forEach(([env, list]) => byEnv[env].push(`<span class="rm-bk" title="${esc(list.join("\n"))}">退避 ${list.length}件</span>`));
    // 長いと1行で切って「…」。▸ で全部出す（開いた状態は取り直しても覚えておく）
    const br = Object.entries(byEnv).map(([env, list]) => {
      const k = `${i.id}|${env}`, open = rmBrOpen.has(k);
      return `<span class="rm-br${open ? " open" : ""}" data-k="${esc(k)}"><span class="rm-br-text">${esc(env)}: ${list.join(", ")}</span><button class="rm-br-tg" hidden></button></span>`;
    });
    const hist = i.history.length ? [`<span title="直近${rmData ? rmData.history_days : 30}日に、ユーザーが入力した文にこの番号が出たセッション">履歴: ${i.history.map((h) => `${esc(h.env)} ${mdDate(h.last)}`).join("・")}</span>`] : [];
    const full = rmFull[i.id];
    const fullInfo = full ? [full.loading ? `<span>全期間を調べています…</span>` : fullHtml(full)] : [];
    const info = [...(td ? [todayHtml(td)] : []), ...rmRelHtml(i).filter((h) => h.includes("rm-wait")), ...sess, ...br, ...hist, ...fullInfo, ...rmRelHtml(i).filter((h) => !h.includes("rm-wait"))];
    return `<div class="rm-row">
      <div class="rm-head">${i.priority ? `<span class="rm-tag ${i.priority === "急いで" || i.priority === "今すぐ" ? "hot" : ""}">${esc(i.priority)}</span>` : ""}
        ${i.extra ? `<span class="rm-tag extra" title="今日作業したが、自分担当の未完了チケットではないもの">${i.closed ? "完了" : `担当外${i.assignee ? `: ${esc(i.assignee)}` : ""}`}</span>` : ""}
        ${i.status ? `<span class="rm-tag">${esc(i.status)}</span>` : ""}
        <span class="rm-subj" title="#${i.id}: ${esc(i.subject)}"><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">#${i.id}</a>: ${esc(i.subject)}</span>
        <button class="rm-copy" data-copy="${esc(`#${i.id}: ${i.subject}`)}" title="「#番号: タイトル」をコピー">⧉</button>
        ${!i.history.length && !full ? `<button class="rm-full" data-ticket="${i.id}" title="直近${rmData ? rmData.history_days : 30}日に見つからなかったので、残っている Claude・Codex の記録全部と各環境の git のコミットから探す">全期間で調べる</button>` : ""}</div>
      ${info.length ? `<div class="rm-info">${info.join("")}</div>` : ""}
      ${opts.todayLog && td ? todayLogHtml(td) : ""}
    </div>`;
  }).join("") : `<div class="empty">該当するチケットはありません</div>`;
}
// 絞り込みの選択肢: 状況（セッションあり・待ちあり・ブランチあり）とステータス
const RM_FILTERS = {
  "s:sess": ["セッションあり", (i) => i.sessions.length > 0],
  "s:wait": ["待ちあり（未完了）", (i) => i.relations.some((r) => r.kind === "wait" && !r.closed)],
  "s:branch": ["ブランチあり", (i) => i.branches.length > 0],
};
function rmFilterFn(v) {
  if (!v) return () => true;
  if (RM_FILTERS[v]) return RM_FILTERS[v][1];
  return (i) => i.status === v.slice(3);
}
function rmText(i) {
  return [`#${i.id}`, i.subject, i.status, i.priority, ...i.branches.map((b) => `${b.env} ${b.branch}`),
    ...i.sessions.map((x) => `[${x.slot}] ${x.env} ${x.kind} ${x.skill}`), ...i.relations.map((r) => `#${r.id}`), ...i.history.map((h) => h.env)].join(" ").toLowerCase();
}
function renderRmAll() {
  if (!rmData) return;
  const cat = $("rm-cat").value, words = $("rm-q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const statuses = [...new Set(rmData.issues.map((i) => i.status))];
  const count = (fn) => rmData.issues.filter(fn).length;
  // 「今日作業した」は担当外・完了済み（today_extra）も含め、最後に作業した時刻の新しい順
  const todayItems = [...rmData.issues, ...(rmData.today_extra || [])].filter(todayOf)
    .sort((a, b) => todayOf(b).last - todayOf(a).last);
  $("rm-cat").innerHTML = [`<option value="">すべて（${rmData.issues.length}）</option>`,
    `<option value="s:today" ${cat === "s:today" ? "selected" : ""} title="朝 4:00 以降に作業したもの">今日作業した（${todayItems.length}）</option>`]
    .concat(Object.entries(RM_FILTERS).map(([k, [label, fn]]) => `<option value="${k}" ${k === cat ? "selected" : ""}>${label}（${count(fn)}）</option>`))
    .concat(statuses.map((st) => `<option value="st:${esc(st)}" ${cat === `st:${st}` ? "selected" : ""}>ステータス: ${esc(st)}（${count((i) => i.status === st)}）</option>`)).join("");
  const isToday = cat === "s:today";
  const fn = rmFilterFn(isToday ? "" : cat);
  const items = (isToday ? todayItems : rmData.issues).filter((i) => fn(i) && words.every((w) => rmText(i).includes(w)));
  const body = $("rm-all"), top = body.scrollTop;
  body.innerHTML = rmRows(items, { todayLog: isToday }); fitBr(body);
  body.scrollTop = top;
  $("rm-modal-meta").textContent = isToday ? `${items.length} 件（${hm(rmData.today.start)} 以降）` : `${items.length} / ${rmData.issues.length} 件`;
}
async function loadRedmine(force) {
  try {
    const d = await (await fetch(`/api/redmine${force ? "?refresh=1" : ""}`)).json();
    if (d.error) { $("redmine").innerHTML = `<div class="err">${esc(d.error)}</div>`; return; }
    rmData = d;
    $("redmine").innerHTML = rmRows(d.issues.slice(0, 10)); fitBr($("redmine"));
    // 10 件以下でも、今日作業したもの（担当外・完了済みを含む）があれば詳細画面を開けるようにする
    $("redmine-more").style.display = d.issues.length > 10 || Object.keys((d.today || {}).tickets || {}).length ? "" : "none";
    const t = new Date(d.fetched_at * 1000).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
    $("redmine-meta").textContent = `${d.issues.length} 件・Redmine は ${t} 時点（5分ごとに取り直し）`;
    if (rmOpen) renderRmAll();
  } catch (e) { /* 接続エラーは refresh() 側で表示する */ }
}
function openRm() {
  try { history.pushState({ rm: 1 }, ""); } catch (e) {}
  rmOpen = true;
  $("rm-modal").classList.add("open");
  $("rm-all").scrollTop = 0;
  renderRmAll();
}
function hideRm() { rmOpen = false; $("rm-modal").classList.remove("open"); }
function closeRm() { if (!rmOpen) return; if (history.state && history.state.rm) history.back(); else hideRm(); }
window.addEventListener("popstate", hideRm);
$("redmine-more").onclick = openRm;
$("redmine-reload").onclick = () => loadRedmine(true);
$("rm-back").onclick = (e) => { e.preventDefault(); closeRm(); };
$("rm-cat").onchange = () => { $("rm-all").scrollTop = 0; renderRmAll(); };
$("rm-q").oninput = () => { clearTimeout(rmTimer); rmTimer = setTimeout(() => { $("rm-all").scrollTop = 0; renderRmAll(); }, 200); };
let downOnRmOverlay = false;
$("rm-modal").addEventListener("mousedown", (e) => { downOnRmOverlay = e.target.id === "rm-modal"; });
$("rm-modal").addEventListener("click", (e) => { if (e.target.id === "rm-modal" && downOnRmOverlay) closeRm(); downOnRmOverlay = false; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && rmOpen) closeRm(); });

// ヘッダーの CPU・メモリ。CPU は使用率で色、メモリは Mac の圧迫レベル（1=正常 2=警告 4=危険）で色を変える
const PRESSURE = { 1: ["正常", ""], 2: ["警告", "warn"], 4: ["危険", "bad"] };
function setGauge(id, pct, text, cls, title) {
  const g = $(id), bar = g.querySelector(".bar > i");
  bar.style.width = pct == null ? "0" : `${Math.min(100, pct)}%`;
  bar.className = cls || "";
  g.querySelector(".gauge-val").textContent = text;
  g.title = title || "";
}
async function loadSys() {
  try {
    const d = await (await fetch("/api/sys")).json();
    const c = d.cpu;
    setGauge("g-cpu", c, c == null ? "–" : `${Math.round(c)}%`, c >= 90 ? "bad" : c >= 70 ? "warn" : "", "全コア合計");
    const m = d.mem;
    if (!m) { setGauge("g-mem", null, "–"); return; }
    const gb = (b) => (b / 2 ** 30).toFixed(1);
    const [label, cls] = PRESSURE[m.pressure] || [`レベル${m.pressure}`, "warn"];
    setGauge("g-mem", m.pct, `${gb(m.used)}/${gb(m.total)}GB`, cls, `${Math.round(m.pct)}%・圧迫: ${label}`);
  } catch (e) { setGauge("g-cpu", null, "–"); setGauge("g-mem", null, "–"); }
}

loadSys();
setInterval(loadSys, 3000);
refresh();
setInterval(refresh, 30000);
loadRedmine();
setInterval(loadRedmine, 60000);
loadLinks();
setInterval(loadLinks, 30000);
refreshPanes();
setInterval(refreshPanes, 5000);
fetch("/api/job").then((r) => r.json()).then((j) => { renderJob(j); if (j.running && !jobPolling) jobPolling = setInterval(pollJob, 1500); });
</script>
