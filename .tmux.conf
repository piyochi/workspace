bind r source-file ~/.tmux.conf ; display-message "Reload Config!!"

set-window-option -g mode-keys vi

bind L last-window

# レイアウト切り替え無効化（誤操作防止）
unbind Space

# 新規ウィンドウ
bind c new-window -c "#{pane_current_path}"

# 分割
bind s split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"
# ペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインサイズ変更 c-b + c+(j k h l)
bind -r C-g resize-pane -L 5
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# 色設定
set -g status-interval 10
set -g status-bg white
setw -g window-status-current-style fg=white,bg=blue


set -g pane-active-border-style fg=white


#set -g @tpm_plugins ' \
#  tmux-plugins/tpm \
#'
#run-shell '~/.tmux/plugins/tpm/tpm'

set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-resurrect      \
'

set -g @resurrect-strategy-vim 'session'

run-shell '~/.tmux/plugins/tpm/tpm'

set-option -sg exit-unattached off

# ssh でログインするとwindow_nameが変わるため、変わらないように設定
set-option -g allow-rename off

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB'
# >>> claude-history >>>
# Claude Code / Kiro CLI が動いているペインでは C-r で全セッションのプロンプト履歴を fzf 検索（それ以外は通常の C-r）
bind -n C-r if-shell "ps -o comm= -t '#{pane_tty}' | grep -qxE 'claude|kiro-cli'" \
  "display-popup -E -w 90% -h 85% -d '#{pane_current_path}' \"/Users/piyoh/www/ticket_v2/bin/claude-history --tmux-paste\"" \
  "send-keys C-r"
