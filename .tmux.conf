bind r source-file ~/.tmux.conf ; display-message "Reload Config!!"

set-window-option -g mode-keys vi

bind L last-window

# レイアウト切り替え無効化（誤操作防止）
unbind Space

# 新規ウィンドウ
bind c new-window -c "#{pane_current_path}"

# 分割
bind s split-window -v -c "#{pane_current_path}"
bind b split-window -h -c "#{pane_current_path}"
# ペイン移動
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ペインサイズ変更 c-b + c+(j k h l)
bind -r C-g resize-pane -L 5
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# 色設定
set -g status-interval 10
set -g status-bg white
setw -g window-status-current-style fg=white,bg=blue

# タブ一覧の最後のタブの右に環境1・2のサーバー状態（api / app / sqs）を出す。中身は ~/bin/tmux-server-status
# tmux 3.5a 既定の status-format[0] のうち、最後のタブの後ろ（#{?window_end_flag,,区切り}）だけを差し替えている
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,  #(~/bin/tmux-server-status)#[default],#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,  #(~/bin/tmux-server-status)#[default],#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

set -g pane-active-border-style fg=white


#set -g @tpm_plugins ' \
#  tmux-plugins/tpm \
#'
#run-shell '~/.tmux/plugins/tpm/tpm'

set -g @tpm_plugins '              \
  tmux-plugins/tpm                 \
  tmux-plugins/tmux-resurrect      \
'

set -g @resurrect-strategy-vim 'session'

run-shell '~/.tmux/plugins/tpm/tpm'

set-option -sg exit-unattached off

# ssh でログインするとwindow_nameが変わるため、変わらないように設定
set-option -g allow-rename off

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:RGB,screen-256color:RGB,tmux-256color:RGB'
# >>> claude-history >>>
# Claude Code が動いているペインでは C-r で全セッションのプロンプト履歴を fzf 検索（それ以外は通常の C-r）
bind -n C-r if-shell "ps -o comm= -t '#{pane_tty}' | grep -qx claude" \
  "display-popup -E -w 90% -h 85% -d '#{pane_current_path}' \"/Users/piyoh/www/ticket_v2/bin/claude-history --tmux-paste\"" \
  "send-keys C-r"
